<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="/favicon.ico" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="description"
    content="Skrivla is a self-hostable collaborative editor for quick brainstorming sessions, meeting notes, and shared writing. Just share a link and write together." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Skrivla" />
  <meta property="og:title" content="Skrivla - Self-hostable collaborative editor" />
  <meta property="og:description"
    content="Just share a link and instantly write together. No login needed. Rich text editing, Markdown shortcuts, and self-hostable on Luvabase and Cloudflare." />
  <meta property="og:image" content="/og.png" />
  <meta property="og:image:alt" content="Screenshot of the Skrivla collaborative editor" />
  <meta property="og:image:width" content="1199" />
  <meta property="og:image:height" content="534" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Skrivla - Self-hostable collaborative editor" />
  <meta name="twitter:description"
    content="Just share a link and instantly write together. No login needed. Rich text editing, Markdown shortcuts, and self-hostable on Luvabase and Cloudflare." />
  <meta name="twitter:image" content="/og.png" />
  <meta name="twitter:image:alt" content="Screenshot of the Skrivla collaborative editor" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
  <script>
    ; (() => {
      const media = window.matchMedia("(prefers-color-scheme: dark)")
      const syncTheme = () => {
        document.documentElement.classList.toggle("dark", media.matches)
        document.documentElement.style.colorScheme = media.matches ? "dark" : "light"
      }

      syncTheme()
      media.addEventListener("change", syncTheme)
    })()
  </script>
  <title>Skrivla</title>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
